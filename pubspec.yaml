name: tamil_speech_app
description: A Tamil speech learning application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^10.2.0
  
  # State Management
  provider: ^6.0.5
  
  # Firebase
  firebase_core: ^2.17.0
  firebase_auth: ^4.10.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  
  # Audio
  audioplayers: ^5.1.0
  record: ^4.4.4
  permission_handler: ^10.4.5
  
  # File handling
  path_provider: ^2.1.1
  
  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  
  # Utilities
  shared_preferences: ^2.2.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/visemes/
    - assets/fonts/
    
  
  fonts:
    - family: null
      fonts:
        - asset: assets/fonts/Tamil.ttf
    - family: SunTommy
      fonts:
        - asset: assets/fonts/SunTommy-y-Tamil-Normal.ttf